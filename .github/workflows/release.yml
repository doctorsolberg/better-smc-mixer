name: Release

# A tag vX.Y.Z builds the release package from source, checks that every image is byte-identical to
# the candidate verified on the mixer (release/expected.json), and creates a draft GitHub release.
# The maintainer publishes the draft; publishing deploys the site (pages.yml).

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag names VERSION
        run: test "v$(cat VERSION)" = "$GITHUB_REF_NAME"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: deps
          key: deps-${{ hashFiles('tools/env/fetch_deps.sh') }}
      - name: Fetch the pinned JieLi toolchain and SDK (hash-checked, not redistributed)
        run: tools/env/fetch_deps.sh
      - name: Publication checks
        run: |
          python3 -I tools/release/check_public.py
          python3 -I tools/release/check_docs.py
          python3 -I tools/release/check_versions.py
      - name: Build every image twice and pack
        run: python3 -I tools/release/release.py --twice --date "$(date -u +%Y-%m-%d)"
      - name: The images are the ones verified on the mixer
        run: python3 -I tools/release/publish.py expected build/release release/expected.json
      - name: Zip and notes
        run: |
          v=$(cat VERSION)
          python3 -I tools/release/publish.py zip build/release "build/better-smc-mixer-$v.zip"
          python3 -I tools/release/publish.py notes build/release release/notes.md > build/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            build/better-smc-mixer-*.zip
            build/release/SHA256SUMS
            build/release/manifest.json
            build/notes.md
          if-no-files-found: error

  draft:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          pre=""
          case "$v" in 0.*|*-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft $pre --verify-tag \
            --title "better-smc-mixer $v" --notes-file out/notes.md \
            out/better-smc-mixer-*.zip out/release/SHA256SUMS out/release/manifest.json
