name: Pages

# Publishing a release deploys the site: the home page (site/), that release's package at the root
# (editor/, manifest.json, firmware/), and every older release's package under /vX.Y.Z/.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (vX.Y.Z)'
        required: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false
      - name: Download the release packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p zips
          for t in $(gh release list --exclude-drafts --limit 100 --json tagName --jq '.[].tagName'); do
            gh release download "$t" --pattern 'better-smc-mixer-*.zip' --dir zips
          done
          v="${TAG#v}"
          test -f "zips/better-smc-mixer-$v.zip"
          mkdir -p pkg && cd pkg && python3 -I -c "import sys,zipfile; zipfile.ZipFile(sys.argv[1]).extractall('.')" "../zips/better-smc-mixer-$v.zip"
      - name: Assemble the site
        run: |
          v="${TAG#v}"
          python3 -I tools/release/publish.py site "pkg/better-smc-mixer-$v" site _site zips/*.zip
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
